<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>SMPC</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#b5662d">
<link rel="icon" href="icone-192.png">
<link rel="apple-touch-icon" href="icone-192.png">

<style>
  :root{--bg:#f4f1ec;--card:#fff;--ink:#1d1d1b;--mute:#6b6862;--line:#e4dfd6;--acc:#b5662d;
    --jaune:#fff3c4;--jauneT:#7a5b00;--vert:#d8f0dc;--vertT:#1f6b34;--orange:#ffe0b8;--orangeT:#8a4b00;
    --rouge:#f8d4d4;--rougeT:#9b1c1c;}
  @media (prefers-color-scheme:dark){:root{--bg:#171614;--card:#22211e;--ink:#f1eee8;--mute:#a19d95;--line:#35332e;
    --jaune:#4a3d10;--jauneT:#ffe08a;--vert:#183d22;--vertT:#9be3ad;--orange:#4a2d0e;--orangeT:#ffc27a;--rouge:#4a1a1a;--rougeT:#ffb3b3;}}
  *{box-sizing:border-box}
  body{margin:0;font:16px/1.35 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
  header{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 16px;border-bottom:1px solid var(--line)}
  .hd{display:flex;align-items:center;gap:10px;min-height:36px}
  h1{margin:0;font-size:18px;letter-spacing:.02em}
  .bk{font:inherit;font-weight:700;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 14px}
  .tabs{display:none}
  .tab{flex:1;border:0;background:none;padding:10px 0;font:inherit;font-weight:600;color:var(--mute);border-bottom:3px solid transparent}
  .tab.on{color:var(--ink);border-color:var(--acc)}
  main{padding:12px 16px 170px;max-width:720px;margin:0 auto}
  /* page d'accueil */
  .home{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding-top:6px}
  .tile{font:inherit;text-align:left;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:16px;padding:14px;min-height:104px;display:flex;flex-direction:column;justify-content:space-between}
  .tile:active{background:var(--line)}
  .tile .ti{font-size:28px;line-height:1}
  .tile b{font-size:17px}
  .tile .sub{min-height:18px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:0 0 14px;overflow:hidden}
  .ch{display:flex;justify-content:space-between;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
  .ch b{font-size:17px;text-transform:capitalize}
  .sub{color:var(--mute);font-size:14px}
  .badge{align-self:flex-start;white-space:nowrap;border-radius:999px;padding:4px 10px;font-weight:700;font-size:14px}
  .b-r{background:var(--rouge);color:var(--rougeT)} .b-v{background:var(--vert);color:var(--vertT)}
  .ln{display:grid;grid-template-columns:30px 1fr auto;gap:4px 8px;padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer}
  .ln:last-of-type{border-bottom:0}
  .ln:active{background:var(--line)}
  .n{font-weight:700;color:var(--mute)}
  .mt{font-weight:700;white-space:nowrap}
  .chip{grid-column:2/3;justify-self:start;border-radius:8px;padding:3px 10px;font-size:14px;font-weight:600}
  .lid{grid-column:3;justify-self:end;align-self:center;font:11px/1 ui-monospace,Menlo,monospace;color:var(--mute);opacity:.8}
  .ln.sel{background:var(--jaune)}
  .n{cursor:pointer;white-space:nowrap}
  #bar{position:fixed;left:0;right:0;bottom:calc(var(--nh) + env(safe-area-inset-bottom));z-index:6;display:none;gap:8px;align-items:center;padding:10px 16px;background:var(--card);border-top:2px solid var(--acc)}
  #bar span{flex:1;font-weight:700}
  .c-j{background:var(--jaune);color:var(--jauneT)} .c-v{background:var(--vert);color:var(--vertT)} .c-o{background:var(--orange);color:var(--orangeT)}
  .cf{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--line)}
  button.act{font:inherit;font-weight:700;border-radius:10px;border:1px solid var(--line);padding:10px 14px;background:var(--card);color:var(--ink)}
  button.prim{flex:1;background:var(--acc);border-color:var(--acc);color:#fff}
  button.prim:disabled{opacity:.35}
  button.prim.conf{background:var(--vertT);border-color:var(--vertT)}
  button.act:disabled{opacity:.45}
  .sec{margin:22px 0 8px;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--mute)}
  .dic{padding:10px 14px;border-bottom:1px solid var(--line)} .dic:last-child{border-bottom:0}
  .vide{text-align:center;color:var(--mute);padding:40px 0}
  /* 05/11/2026 : état (point, heure, compteur) dans l'en-tête ; barre d'icônes fixe en bas */
  :root{--nh:58px}
  #etat{margin-left:auto;font-size:12px;color:var(--mute);text-align:right;line-height:1.25;white-space:nowrap}
  #etat #cpt{display:block}
  #back{display:none!important}
  #nav{position:fixed;left:0;right:0;bottom:0;z-index:7;display:flex;background:var(--card);border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom)}
  #nav button{flex:1 1 0;min-width:0;height:var(--nh);border:0;background:none;color:var(--mute);font:inherit;font-size:10px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;position:relative;padding:0}
  #nav button .ni{font-size:21px;line-height:1;filter:grayscale(1);opacity:.7}
  #nav button.on{color:var(--ink);font-weight:700}
  #nav button.on .ni{filter:none;opacity:1}
  #nav button.on::before{content:'';position:absolute;top:0;left:22%;right:22%;height:3px;border-radius:0 0 3px 3px;background:var(--acc)}
  #nav .nb{position:absolute;top:5px;left:50%;margin-left:5px;min-width:16px;height:16px;border-radius:8px;background:#c0392b;color:#fff;
    font-size:10px;font-weight:700;line-height:16px;padding:0 4px;text-align:center}
  #nav .nb:empty{display:none}
  .hors{background:var(--jaune);color:var(--jauneT);border-radius:6px;padding:1px 6px;font-weight:700}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#3aa35b;margin-right:6px}
  .dot.ko{background:#c0392b}
  /* sélecteur */
  #pk,#plm{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:10}
  #pk.on,#plm.on{display:block}
  .sheet{position:absolute;left:0;right:0;bottom:0;max-height:88vh;overflow:auto;background:var(--card);border-radius:16px 16px 0 0;padding:14px 16px 24px}
  .sheet h2{font-size:16px;margin:0 0 4px}
  #q{width:100%;font:inherit;font-size:18px;padding:12px;border-radius:10px;border:2px solid var(--acc);background:var(--bg);color:var(--ink);margin:8px 0}
  .opts{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 10px}
  .opt{font:inherit;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:9px 12px}
  .opt.int{font-size:13px;font-weight:700}
  .opt.new{border-color:var(--acc);color:var(--acc);font-weight:700}
  #toast{position:fixed;left:16px;right:16px;bottom:calc(var(--nh) + 12px + env(safe-area-inset-bottom));background:var(--ink);color:var(--bg);padding:12px 14px;border-radius:10px;display:none;z-index:20}
  .c-r{background:var(--rouge);color:var(--rougeT)}
  .hr{display:grid;grid-template-columns:52px 1fr auto;gap:8px;padding:10px 14px;border-top:1px solid var(--line)}
  .hr.ha{border-left:4px solid var(--rougeT)}
  .hh{font-weight:700;font-variant-numeric:tabular-nums;color:var(--mute);font-size:14px;line-height:1.5}
  .hr .chip{display:inline-block;margin-top:4px}
  .hl{animation:flash 8s ease-out}
  @keyframes flash{0%,40%{background:var(--jaune)}100%{background:transparent}}
  .lab{display:inline-block;min-width:92px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--mute)}
  .hl1{margin-top:3px}
  .hl2{margin-top:2px;font-size:14px;color:var(--mute)}
  footer{align-items:center}
  .cl{font-weight:700;font-size:15px;text-decoration:none;color:#fff;background:var(--acc);border-radius:999px;padding:8px 18px}
  /* onglet Catalogue */
  .tabs .tab{font-size:15px}
  #dz{padding:8px 0 10px}
  #dtx{width:100%;font:inherit;font-size:17px;padding:10px;border-radius:10px;border:2px solid var(--acc);background:var(--card);color:var(--ink);resize:vertical}
  .dzb{display:flex;gap:8px;margin-top:6px} .dzb .prim{flex:1}
  #mic.on{background:var(--rouge);color:var(--rougeT);border-color:var(--rougeT)}
  #dst{margin-top:6px} #dst:empty{display:none}
  .nte.al{color:var(--rougeT);background:var(--rouge)}
  @media (max-width:480px){.tabs .tab{font-size:13px}}
  #naf{display:inline-block;margin-left:4px;min-width:18px;border-radius:999px;background:var(--acc);color:#fff;font-size:12px;padding:1px 6px}
  #naf:empty{display:none}
  .af{padding:12px 14px;border-bottom:1px solid var(--line)} .af:last-child{border-bottom:0}
  .afq{margin:6px 0 8px;font-weight:600}
  .afa{width:100%;font:inherit;font-size:17px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);margin:6px 0}
  .afr{color:var(--vertT);background:var(--vert);border-radius:8px;padding:6px 10px;font-size:14px}
  .af a{color:var(--acc)}
  #catf{width:100%;font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);margin:0 0 10px}
  .cw{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:14px}
  table.cat{border-collapse:collapse;width:100%;font-size:14px}
  table.cat th{position:sticky;top:0;background:var(--card);text-align:left;padding:9px 10px;border-bottom:2px solid var(--line);white-space:nowrap;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--mute);cursor:pointer}
  table.cat td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
  table.cat tr.r{cursor:pointer} table.cat tr.r:active{background:var(--line)}
  table.cat td.p{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
  table.cat td.d{min-width:220px}
  table.cat td.f{text-transform:capitalize;white-space:nowrap}
  table.cat tr.dt td{background:var(--bg);color:var(--mute);font-size:13px}
  table.cat .min{background:var(--vert);color:var(--vertT);border-radius:6px;padding:1px 6px;font-weight:700}
  .nte{grid-column:2/4;font-size:14px;color:var(--orangeT);background:var(--orange);border-radius:8px;padding:3px 8px;justify-self:start}
  #nt{width:100%;font:inherit;font-size:17px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);margin:4px 0}
  .cn{display:inline-block;margin-left:6px;font-size:12px;font-weight:700;border-radius:999px;padding:1px 8px;background:var(--orange);color:var(--orangeT)}
  /* alertes de l'accueil */
  #alr:empty{display:none}
  .alb{display:flex;align-items:center;gap:8px;margin:2px 0 10px;font-weight:700;color:var(--rougeT)}
  .alb .rd{background:#c0392b;color:#fff;border-radius:999px;min-width:26px;text-align:center;padding:2px 9px}
  .alc{background:var(--card);border:1px solid var(--line);border-left:5px solid #c0392b;border-radius:12px;padding:10px 12px;margin:0 0 10px}
  .alc .alt{font-weight:700;word-break:break-word}
  .alc .alp{margin:6px 0;padding:8px 10px;border-radius:8px;background:var(--rouge);color:var(--rougeT);font-weight:600}
  .alc .alx{font-size:14px;color:var(--mute);margin:4px 0}
  .alc audio{width:100%;margin:6px 0}
  .alc textarea{width:100%;font:inherit;font-size:17px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);margin:6px 0 0;min-height:64px}
  .alr2{display:flex;gap:8px;margin-top:6px}.alr2 .act{flex:1}
  /* 05/11/2026 : action à faire + liens prêts */
  .alc .alk{display:inline-block;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;border-radius:999px;padding:2px 9px;background:var(--orange);color:var(--orangeT)}
  .alc .alp{font-weight:600;line-height:1.4}
  .ald{margin:6px 0}
  .ald summary{cursor:pointer;font-weight:700;color:var(--acc);padding:6px 0}
  .algt{font-weight:700;font-size:14px;margin:10px 0 4px}
  .alsc{overflow-x:auto;margin:0 -12px;padding:0 12px}
  table.alt2{border-collapse:collapse;width:100%;font-size:13px}
  table.alt2 th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--mute);padding:4px 6px;border-bottom:2px solid var(--line);white-space:nowrap}
  table.alt2 td{padding:5px 6px;border-bottom:1px solid var(--line);vertical-align:top}
  table.alt2 td{white-space:nowrap} table.alt2 td:last-child{white-space:normal;min-width:140px}
  table.alt2 td.aln{color:var(--mute);font-variant-numeric:tabular-nums}
  .all{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0}
  .all a.act{flex:1;text-align:center;text-decoration:none;min-width:130px;font:inherit;font-weight:700;border-radius:10px;border:1px solid var(--line);padding:10px 14px;background:var(--card);color:var(--ink)}
  .all a.act.prim{background:var(--acc);border-color:var(--acc);color:#fff}
</style>
</head>
<body>
<header>
  <div class="hd"><button class="bk" id="back" onclick="accueil()" style="display:none">‹ Accueil</button><h1 id="titre">SMPC</h1><span id="etat"><span class="dot" id="dot"></span><span id="maj">—</span><span id="cpt"></span></span></div>
  <div class="tabs">
    <button class="tab on" id="t1" onclick="onglet(1)">BL en cours</button>
    <button class="tab" id="t2" onclick="onglet(2)">À rendre</button>
    <button class="tab" id="t3" onclick="onglet(3)">Heures</button>
    <button class="tab" id="t4" onclick="onglet(4)">Catalogue</button>
     <button class="tab" id="t5" onclick="ongletTrajets()">Trajets</button>
  </div>
</header>
<main id="main"><div class="vide">Chargement…</div></main>
<nav id="nav"></nav>

<div id="pk" onclick="if(event.target.id==='pk')fermer()">
  <div class="sheet">
    <h2 id="pkT"></h2><div class="sub" id="pkS"></div>
    <input id="q" autocomplete="off" placeholder="Tape 3 lettres du client…" oninput="filtrer()">
    <div class="opts" id="res"></div>
    <div class="sec">Récents</div><div class="opts" id="rec"></div>
    <div class="sec">Comptes internes</div><div class="opts" id="int"></div>
    <div class="opts"><button class="opt" onclick="choisir('')">Effacer le client</button></div>
  </div>
</div>
<div id="plm" onclick="if(event.target.id==='plm')plMenuFermer()"><div class="sheet" id="plms"></div></div>
<div id="bar"><span id="barT"></span><button class="act" onclick="viderSel()">Annuler</button><button class="act prim" style="flex:0 0 auto" onclick="ouvrirSel()">Affecter</button></div>
<div id="toast"></div>

<script>
/* ===== 05/11/2026 : application installée sur le téléphone (page GitHub smpc-dictee/app/) =====
   Dans Apps Script, google.script.run existe et ce bloc ne fait rien.
   Hors de Google, il le remplace : chaque appel part à doPost (chat.gs → Api.gs) avec le jeton
   de la page de dictée (même site, même mémoire : smpc_url, smpc_jeton).
   Ouverture immédiate : la dernière réponse de chaque lecture est gardée sur le téléphone et
   affichée tout de suite, puis remplacée par la réponse fraîche. Les écritures ne sont jamais rejouées. */
(function(){
  if (window.google && google.script && google.script.run) return;
  window.HORS_GAS = true;
  var URL_DEFAUT = 'https://script.google.com/macros/s/AKfycbwyd2qY9wQKEpR8WArWwFhghePVgZs0SLLCqNDRPodzMoBCFCMViXeYV4wt_4Yb3N__/exec';
  var LIRE = {getState:1,getAlertes:1,getARendre:1,getClients:1,getHeures:1,getHeuresHV:1,nbPropositions:1,
    getCatalogue:1,getAvancement:1,getPlanning:1,getUrlTrajets:1,getUrlFactures:1};
  var lire = function(k){try{return localStorage.getItem(k);}catch(e){return null;}};
  var ecrire = function(k,v){try{localStorage.setItem(k,v);}catch(e){}};
  var url = function(){return lire('smpc_url')||URL_DEFAUT;};
  var DEMANDE = false;
  var jeton = function(){
    var j=lire('smpc_jeton');
    if(!j&&!DEMANDE){DEMANDE=true;j=(prompt('Jeton SMPC (le même que la page de dictée) :')||'').trim();if(j){ecrire('smpc_jeton',j);DEMANDE=false;}}
    return j||'';
  };
  var FRAIS = {};   // clé → heure de la dernière réponse du serveur (cette session)
  window.HORS_LIGNE = false;
  function etat(hors){
    window.HORS_LIGNE = hors;
    var m=document.getElementById('maj'); if(!m)return;
    var t=m.querySelector('.hors'); if(hors&&!t){t=document.createElement('span');t.className='hors';t.textContent='hors ligne';m.prepend(t,' ');}
    if(!hors&&t)t.remove();
  }
  function appeler(fn,args,ok,ko){
    var cle='smpc_c_'+fn+JSON.stringify(args), maintenant=Date.now();
    if (LIRE[fn] && ok && !(FRAIS[cle] > maintenant-5000)) {
      var c=lire(cle);
      if (c) setTimeout(function(){ if(!(FRAIS[cle]>maintenant)) try{ ok(JSON.parse(c)); }catch(e){} },0);
    }
    var j=jeton(), ctl=('AbortController' in window)?new AbortController():null;
    var minut=setTimeout(function(){ctl&&ctl.abort();},45000);
    fetch(url(),{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({action:'run',jeton:j,fn:fn,args:args}),signal:ctl?ctl.signal:undefined})
      .then(function(r){return r.json();})
      .then(function(r){
        clearTimeout(minut); etat(false);
        if(!r.ok){ if(/jeton/i.test(r.texte||'')){ecrire('smpc_jeton','');DEMANDE=false;} throw new Error(String(r.texte||'Erreur').replace(/^✗\s*/,'')); }
        FRAIS[cle]=Date.now();
        if(LIRE[fn]) ecrire(cle,JSON.stringify(r.r));
        ok&&ok(r.r);
      })
      .catch(function(e){
        clearTimeout(minut);
        var hors = !e || e.name==='AbortError' || e.name==='TypeError';
        if(hors) etat(true);
        var msg = hors ? 'Pas de réseau : données du dernier passage.'
          : e.name==='SyntaxError' ? 'Réponse illisible de la webapp (adresse ou accès du déploiement ?)' : (e.message||String(e));
        ko&&ko({message: msg});
      });
  }
  function coureur(ok,ko){
    return new Proxy({},{get:function(_,p){
      if(p==='withSuccessHandler')return function(f){return coureur(f,ko);};
      if(p==='withFailureHandler')return function(f){return coureur(ok,f);};
      if(p==='withUserObject')return function(){return coureur(ok,ko);};
      return function(){appeler(String(p),Array.prototype.slice.call(arguments),ok,ko);};
    }});
  }
  window.google = {script:{
    run: coureur(null,null),
    url: {getLocation:function(cb){var p={};new URLSearchParams(location.search).forEach(function(v,k){p[k]=v;});cb({parameter:p});}},
    host: {close:function(){}}
  }};
  // liens de la webapp (…/exec?vue=N) ouverts dans l'application, sans repasser par Google
  document.addEventListener('click',function(ev){
    var a=ev.target.closest&&ev.target.closest('a[href]'); if(!a)return;
    var m=a.href.match(/script\.google\.com\/macros\/s\/[^/]+\/exec\?(?:.*&)?vue=([1-8])/);
    if(m&&window.aller){ev.preventDefault();aller(+m[1]);}
  },true);
  // installation (manifeste, service worker)
  if('serviceWorker' in navigator) window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});
})();
</script>
<script>
var S = null, sig = '', vue = 0, CL = null, cible = null, attente = false, confirme = {}, confirmeV = {}, SEL = {}, BUSY = '';

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function eur(n){return (+n||0).toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2})+' €';}
function norm(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').trim();}
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(function(){t.style.display='none';},4500);}
function chipCls(c){if(!c)return'c-j';return /rendre/i.test(c)&&!/rendu/i.test(c)?'c-o':'c-v';}

/* ===== page d'accueil ===== */
var TUILES=[[1,'📦','BL en cours'],[2,'↩️','À rendre'],[3,'⏱️','Heures'],[8,'🧾','Factures'],[7,'📅','Planning'],[6,'📊','Avancement'],[5,'🛻','Trajets'],[4,'🔎','Catalogue']];
function entete(nom){
  document.getElementById('titre').textContent=nom||'SMPC';
  document.getElementById('back').style.display=nom?'':'none';
  var m=document.getElementById('main');m.style.maxWidth='';m.style.padding='';
  document.querySelectorAll('.tabs .tab').forEach(function(t){t.classList.remove('on');});
  setTimeout(navMaj,0);
}
/* ===== barre d'icônes fixe en bas (05/11/2026) ===== */
var NAV=[[0,'🏠','Accueil'],[1,'📦','BL'],[3,'⏱️','Heures'],[8,'🧾','Factures'],[7,'📅','Planning'],[6,'📊','Avanc.'],[2,'↩️','Rendre'],[5,'🛻','Trajets'],[4,'🔎','Catal.']];
function navMaj(){
  var n=document.getElementById('nav'); if(!n)return;
  if(!n.firstChild) n.innerHTML=NAV.map(function(t){
    return '<button id="nv'+t[0]+'" onclick="'+(t[0]===0?'accueil()':'aller('+t[0]+')')+'"><span class="ni">'+t[1]+'</span>'+esc(t[2])+'<span class="nb" id="nvb'+t[0]+'"></span></button>';}).join('');
  NAV.forEach(function(t){var b=document.getElementById('nv'+t[0]);if(b)b.classList.toggle('on',t[0]===vue);});
  var nb=document.getElementById('nvb1'); if(nb&&S&&S.bls) nb.textContent=S.bls.length||'';
  var na=document.getElementById('nvb0'); if(na) na.textContent=(AL&&AL.length)||'';
}
function accueil(){
  vue=0;SEL={};entete('');barre();
  document.getElementById('cpt').textContent='';
  document.getElementById('main').innerHTML='<div id="alr"></div><div class="home">'+TUILES.map(function(t){
    return '<button class="tile" onclick="aller('+t[0]+')"><span class="ti">'+t[1]+'</span><b>'+esc(t[2])+'</b><span class="sub" id="nb'+t[0]+'"></span></button>';}).join('')+'</div>';
  ALS='';chargerAlertes();
  google.script.run.withSuccessHandler(function(s){
    S=s;focusAv(s.focus);document.getElementById('dot').className='dot';document.getElementById('maj').textContent='Mis à jour '+s.maj;
    var b=document.getElementById('nb1');if(b)b.textContent=s.bls.length?s.bls.length+' BL à traiter':'Rien en attente';navMaj();
  }).withFailureHandler(function(){document.getElementById('dot').className='dot ko';}).getState();
}
function aller(n){
  if(n<=4)onglet(n);else if(n===5)ongletTrajets();else if(n===6)ongletAvancement();else if(n===8)ongletFactures();else ongletPlanning();
}

/* ===== alertes (badge rouge) : mémo à réécouter + problème écrit dessous + réponse ===== */
var ALS='', AL=[], ALOUV={}, ALSAISIE=false;
function chargerAlertes(){
  if(vue!==0||document.hidden||ALSAISIE)return;
  google.script.run.withSuccessHandler(recevoirAlertes)
    .withFailureHandler(function(){var z=document.getElementById('alr');if(z&&!ALS)z.innerHTML='';}).getAlertes();
}
function recevoirAlertes(a){
  if(vue!==0||ALSAISIE)return;
  var s=JSON.stringify(a.alertes); if(s===ALS)return; ALS=s; AL=a.alertes; navMaj();
  var z=document.getElementById('alr'); if(!z)return;
  if(!AL.length){z.innerHTML='';return;}
  z.innerHTML='<div class="alb"><span class="rd">'+AL.length+'</span>'+(AL.length>1?'problèmes à régler':'problème à régler')+'</div>'+
    AL.map(function(x,i){
      return '<div class="alc"><div class="alt">'+esc(x.titre)+(x.nb>1?' <span class="sub">× '+x.nb+'</span>':'')+'</div>'+
        (x.date?'<div class="alx">'+esc(x.date)+'</div>':'')+
        (x.audio?'<div id="au'+i+'"><button class="act" onclick="alEcouter('+i+')">▶ Écouter le mémo</button></div>':'')+
        (x.texte?'<div class="alx">« '+esc(x.texte)+' »</div>':'')+
        (x.motcle?'<div class="alk">'+esc(x.motcle)+'</div>':'')+
        '<div class="alp">'+esc(x.probleme)+'</div>'+
        (x.tableau?alTableau(x,i):'')+
        (x.vers?'<div class="all"><button class="act prim" onclick="aller('+x.vers+')">'+esc(x.versLib||'Ouvrir')+'</button></div>':'')+
        ((x.pdf||x.corr)?'<div class="all">'+
          (x.pdf?'<a class="act" href="'+esc(x.pdf)+'" target="_blank" rel="noopener">📄 Document</a>':'')+
          (x.corr?'<a class="act prim" href="'+esc(x.corr)+'" target="'+(/script\.google\.com/.test(x.corr)?'_top':'_blank')+'" rel="noopener">✏️ '+esc(x.corrLib||'Corriger')+'</a>':'')+
        '</div>':'')+
        '<textarea id="ar'+i+'" placeholder="Ta réponse (micro du clavier)…" onfocus="ALSAISIE=true" onblur="ALSAISIE=false"></textarea>'+
        '<div class="alr2"><button class="act prim" onclick="alRepondre('+i+')">Répondre</button>'+
        (x.source!=='dispatch'&&x.source!=='controle'?'<button class="act" id="ok'+i+'" onclick="alRegler('+i+')">Réglé</button>':'')+'</div></div>';
    }).join('');
}
/* 05/11/2026 : carte dépliable, tableau des lignes concernées (cartes Contrôle) */
function alTableau(x,i){
  var T=x.tableau,n=0;T.groupes.forEach(function(g){n+=g.lignes.length;});
  var h='<details class="ald"'+(ALOUV[x.cle]?' open':'')+' ontoggle="ALOUV[\''+esc(x.cle)+'\']=this.open"><summary>Voir '+
    (T.groupes.length>1?'les '+T.groupes.length+' factures':n>1?'les '+n+' lignes':'la ligne')+'</summary>';
  T.groupes.forEach(function(g){
    if(g.titre)h+='<div class="algt">'+esc(g.titre)+'</div>';
    h+='<div class="alsc"><table class="alt2"><tr>'+T.cols.map(function(c){return '<th>'+esc(c)+'</th>';}).join('')+'</tr>'+
      g.lignes.map(function(l){return '<tr>'+l.map(function(c,k){
        return '<td'+(k===0?' class="aln"':'')+'>'+(k===l.length-1&&c&&T.cols[k]===''?'<span class="chip c-o">'+esc(c)+'</span>':esc(c))+'</td>';}).join('')+'</tr>';}).join('')+
      '</table></div>';
  });
  return h+'</details>';
}
function alEcouter(i){
  var x=AL[i],z=document.getElementById('au'+i); if(!x||!z)return;
  z.innerHTML='<span class="sub">⏳ Chargement du mémo…</span>';
  google.script.run.withSuccessHandler(function(r){z.innerHTML='<audio controls autoplay src="'+r.url+'"></audio>';})
    .withFailureHandler(function(e){z.innerHTML='<span class="sub">'+esc(e.message||String(e))+'</span>';}).getAudio(x.audio);
}
function alRepondre(i){
  var x=AL[i],t=document.getElementById('ar'+i); if(!x||!t)return;
  var v=t.value.trim(); if(!v){toast('Dicte ta réponse d\'abord.');t.focus();return;}
  ALSAISIE=false; attente=true;
  google.script.run.withSuccessHandler(function(a){attente=false;toast('Réponse envoyée à Claude.');ALS='';recevoirAlertes(a);})
    .withFailureHandler(function(e){attente=false;toast('✗ '+(e.message||String(e)));}).repondreAlerte(x.cle,x.titre,x.probleme,v);
}
function alRegler(i){
  var x=AL[i],b=document.getElementById('ok'+i); if(!x||!b)return;
  if(!b.dataset.ok){b.dataset.ok=1;b.textContent='Confirmer ?';setTimeout(function(){if(b){delete b.dataset.ok;b.textContent='Réglé';}},4000);return;}
  attente=true;
  google.script.run.withSuccessHandler(function(m){attente=false;toast(m);ALS='';chargerAlertes();})
    .withFailureHandler(function(e){attente=false;toast('✗ '+(e.message||String(e)));}).reglerAlerte(x.cle);
}
/* 31/10/2026 : plus de minuterie propre aux alertes, elles suivent tic() (version « alertes » ou toutes les 30 s) */

/* Tout appel serveur : en cas d'erreur, message + relecture immédiate de la feuille */
function appel(fn,args,ok){
  attente=true;
  var r=google.script.run.withSuccessHandler(function(x){attente=false;document.getElementById('dot').className='dot';ok&&ok(x);})
    .withFailureHandler(function(e){attente=false;toast(e.message||String(e));sig='';charger(true);});
  r[fn].apply(r,args||[]);
}

var ENCOURS=false; /* 23/10/2026 : pas de nouvelle lecture tant que la précédente n'est pas revenue (rafraîchissement 2 s) */
function charger(force){
  if(attente||document.hidden||ENCOURS)return;
  if(vue===3){chargerHeures();return;}
  if(vue===4){chargerCatalogue();return;}
  if(vue!==1)return;
  ENCOURS=true;
  google.script.run.withSuccessHandler(function(s){ENCOURS=false;recevoir(s,force);})
    .withFailureHandler(function(){ENCOURS=false;document.getElementById('dot').className='dot ko';}).getState();
}
function recevoir(s,force){
  setTimeout(navMaj,0);
  document.getElementById('dot').className='dot';
  focusAv(s.focus);
  document.getElementById('maj').textContent='Mis à jour '+s.maj;
  statutDictee(s.dictees);
  var n=JSON.stringify({b:s.bls,d:s.dictes});
  S=s; if(n===sig&&!force)return; sig=n;
  // la sélection ne garde que des id encore présents ET inchangés (n° + article)
  var idx={};S.bls.forEach(function(b){b.lignes.forEach(function(l){idx[l.id]=l;});});
  Object.keys(SEL).forEach(function(id){var l=idx[id];if(!l||l.n!==SEL[id].n||l.art!==SEL[id].art)delete SEL[id];});
  if(vue===1)rendre();
}

function ligneById(id){var r=null;S.bls.forEach(function(b){b.lignes.forEach(function(l){if(l.id===id)r=l;});});return r;}

function rendre(){
  var m=document.getElementById('main'),h='';
  document.getElementById('cpt').textContent=S.bls.length+' BL';
  if(!S.bls.length&&!S.dictes.length){m.innerHTML='<div class="vide">Aucun BL en attente.</div>';barre();return;}
  S.bls.forEach(function(b,bi){
    h+='<div class="card"><div class="ch"><div><b>'+esc(b.fournisseur)+'</b> · '+esc(b.date)+(b.test?' <span class="sub">(essai)</span>':'')+(b.type==='BR'?' <span class="chip c-o">Retour</span>':'')+(b.lignes.some(function(l){return /^\s*⚠/.test(l.note);})?' <span class="chip c-r">⚠ à vérifier</span>':'')+
       '<div class="sub">'+esc(b.ref||'')+' · total '+eur(b.total)+'</div></div>'+
       '<span class="badge '+(Math.abs(b.reste)<0.005?'b-v">✓ réparti':'b-r">Reste '+eur(b.reste))+'</span></div>';
    b.lignes.forEach(function(l){
      var s=SEL[l.id]?' sel':'';
      h+='<div class="ln'+s+'" data-id="'+esc(l.id)+'" onclick="ouvrir(this.dataset.id)">'+
         (b.type==='BR'?'<span class="n">'+esc(l.n)+'</span>':'<span class="n" data-id="'+esc(l.id)+'" onclick="event.stopPropagation();cocher(this.dataset.id)">'+(SEL[l.id]?'☑':'☐')+' '+esc(l.n)+'</span>')+
         '<span>'+esc(l.art)+(l.qte&&l.qte!=='1'?' <span class="sub">× '+esc(l.qte)+'</span>':'')+'</span>'+
         '<span class="mt">'+eur(l.mt)+'</span>'+
         '<span class="chip '+chipCls(l.client)+'">'+(l.client?esc(l.client):'à répartir')+'</span>'+
         '<span class="lid">'+esc(l.id)+'</span>'+(l.note?'<span class="nte'+(/^\s*⚠/.test(l.note)?' al">':'">📝 ')+esc(l.note)+'</span>':'')+'</div>';
    });
    var k=b.key, tous=b.lignes.length&&b.lignes.every(function(l){return SEL[l.id];});
    var occ=(BUSY===k), libV;
    if(b.test)libV='Essai : pas de validation';
    else if(occ)libV='⏳ Enregistrement…';
    else if(confirmeV[k])libV='Confirmer : '+b.lignes.length+' ligne(s), '+eur(b.total);
    else if(!b.complet&&b.type!=='BR')libV='Valider (reste '+eur(b.reste)+')';
    else libV=b.type==='BR'?'Valider le retour':'Valider le BL';
    var okV=(b.type==='BR'||b.complet)&&!b.test&&!BUSY;
    h+='<div class="cf">'+(b.type==='BR'?'':'<button class="act" '+(BUSY?'disabled ':'')+'onclick="toutBL('+bi+')">'+(tous?'☑ Aucune':'☐ Toutes')+'</button>')+
       '<button class="act prim'+(confirmeV[k]?' conf':'')+'" '+(okV?'':'disabled ')+'onclick="valider('+bi+')">'+esc(libV)+'</button>'+
       '<button class="act" '+(BUSY?'disabled ':'')+'onclick="retirer('+bi+')">'+(occ&&!confirmeV[k]?'⏳':confirme[k]?'Confirmer ?':'Retirer')+'</button></div></div>';
  });
  if(S.dictes.length){
    h+='<div class="sec">Dictés, PDF non reçu</div><div class="card">';
    S.dictes.forEach(function(d){
      h+='<div class="dic"><b>'+esc(d.fournisseur)+'</b>'+(d.date?' <span class="sub">'+esc(d.date)+'</span>':' <span class="sub">date ?</span>')+' · '+esc(d.desc)+(d.qte?' <span class="sub">× '+esc(d.qte)+'</span>':'')+
         (d.client?'<br><span class="chip '+chipCls(d.client)+'">'+esc(d.client)+'</span>':'')+' <span class="lid">'+esc(d.id)+'</span></div>';
    });
    h+='</div>';
  }
  m.innerHTML=h;
  barre();
}

/* multi-sélection : toucher la case (n°) coche/décoche ; toucher la ligne = affecter cette ligne seule */
function cocher(id){
  var l=ligneById(id); if(!l)return;
  if(SEL[id])delete SEL[id]; else SEL[id]={id:l.id,n:l.n,art:l.art};
  rendre();
}
function barre(){
  var ids=Object.keys(SEL),b=document.getElementById('bar');
  if(!ids.length||vue!==1){b.style.display='none';return;}
  var t=0;ids.forEach(function(id){var l=ligneById(id);if(l)t+=l.mt;});
  document.getElementById('barT').textContent=ids.length+' ligne(s) · '+eur(t);
  b.style.display='flex';
}
function viderSel(){SEL={};rendre();}
/* sélectionne toutes les lignes d'un BL, ou les désélectionne si elles le sont déjà toutes */
function toutBL(bi){
  var b=S.bls[bi]; if(!b)return;
  var tous=b.lignes.every(function(l){return SEL[l.id];});
  b.lignes.forEach(function(l){if(tous)delete SEL[l.id];else SEL[l.id]={id:l.id,n:l.n,art:l.art};});
  rendre();
}

function onglet(n){
  vue=n;entete(['','BL en cours','À rendre','Heures','Catalogue'][n]);
  document.getElementById('t'+n).classList.add('on');
  document.getElementById('main').style.maxWidth=(n===4?'none':'');
  barre();
  if(n===1){sig='';document.getElementById('main').innerHTML='<div class="vide">Chargement…</div>';charger(true);return;}
  if(n===3){HS=null;HD=null;document.getElementById('main').innerHTML='<div class="vide">Chargement…</div>';chargerHeures();return;}
  if(n===4){CATM='';CATS=null;CATOPEN={};document.getElementById('main').innerHTML='<div class="vide">Chargement…</div>';chargerCatalogue();return;}
  document.getElementById('main').innerHTML='<div class="vide">Chargement…</div>';
  appel('getARendre',[],function(l){
    if(vue!==2)return;
    var h='',g='';
    if(!l.length)h='<div class="vide">Rien à rendre.</div>';
    l.forEach(function(x){
      if(x.fournisseur!==g){if(g)h+='</div>';g=x.fournisseur;h+='<div class="sec">'+esc(g)+'</div><div class="card">';}
      h+='<div class="dic">'+esc(x.desc||'(sans descriptif)')+' <span class="mt">'+eur(x.mt)+'</span><div class="sub">'+esc(x.date)+' · '+esc(x.client)+'</div></div>';
    });
    if(g)h+='</div>';
    document.getElementById('main').innerHTML=h;
    document.getElementById('cpt').textContent=l.length+' article(s)';
  });
}

/* sélecteur de client : la cible = liste d'id + ce que j'avais à l'écran (n°, article) */
function ouvrir(id){
  var l=ligneById(id); if(!l)return;
  ouvrirPour([{id:l.id,n:l.n,art:l.art}], l.n+' · '+l.art+' · '+eur(l.mt), l.desc, l.note);
}
function ouvrirSel(){
  var items=Object.keys(SEL).map(function(id){return SEL[id];});
  if(!items.length)return;
  var t=0;items.forEach(function(i){var l=ligneById(i.id);if(l)t+=l.mt;});
  ouvrirPour(items, items.length+' lignes · '+eur(t), items.map(function(i){return i.n+' '+i.art;}).join(' · '));
}
function ouvrirPour(items,titre,sous,note){
  cible={items:items};
  document.getElementById('pkT').textContent=titre;
  document.getElementById('pkS').textContent=sous;
  var q=document.getElementById('q'); q.value='';
  document.getElementById('pk').className='on';
  var go=function(){filtrer();remplirFixes();setTimeout(function(){q.focus();},50);};
  if(CL)go(); else appel('getClients',[],function(c){CL=c;go();});
}
function fermer(){document.getElementById('pk').className='';cible=null;}
function bouton(nom,cls){return '<button class="opt '+(cls||'')+'" data-n="'+esc(nom)+'" onclick="choisir(this.dataset.n)">'+esc(nom)+'</button>';}
function remplirFixes(){
  var rec=[],vus={};
  (S.bls||[]).forEach(function(b){b.lignes.forEach(function(l){if(l.client&&!vus[l.client]){vus[l.client]=1;rec.push(l.client);}});});
  CL.clients.forEach(function(c){if(rec.length<6&&!c.interne&&!vus[c.nom]){vus[c.nom]=1;rec.push(c.nom);}});
  document.getElementById('rec').innerHTML=rec.slice(0,6).map(function(n){return bouton(n);}).join('');
  document.getElementById('int').innerHTML=CL.internes.map(function(n){return bouton(n,'int');}).join('');
}
function filtrer(){
  var q=norm(document.getElementById('q').value),r=document.getElementById('res');
  if(q.length<2){r.innerHTML='';return;}
  var deb=[],dans=[];
  CL.clients.forEach(function(c){var k=norm(c.nom);if(k.indexOf(q)===0)deb.push(c.nom);else if(k.indexOf(q)>0)dans.push(c.nom);});
  var l=deb.concat(dans).slice(0,8),h=l.map(function(n){return bouton(n);}).join('');
  var exact=CL.clients.some(function(c){return norm(c.nom)===q;});
  if(!exact&&q.length>=3){
    var v=document.getElementById('q').value.trim().toLowerCase();
    h+='<button class="opt new" data-n="'+esc(v)+'" onclick="nouveau(this)">+ Nouveau client « '+esc(v)+' »</button>';
  }
  r.innerHTML=h||'<span class="sub">Aucun client trouvé.</span>';
}
function nouveau(btn){
  if(!btn.dataset.ok){btn.dataset.ok=1;btn.textContent='Créer « '+btn.dataset.n+' » ? Touche encore pour confirmer';return;}
  CL.clients.unshift({nom:btn.dataset.n,interne:false});choisir(btn.dataset.n);
}
function choisir(nom){
  if(!cible)return; var c=cible; fermer();
  appel('setClients',[c.items,nom],function(s){SEL={};sig='';recevoir(s,true);toast(c.items.length>1?c.items.length+' lignes affectées.':'Fait.');});
}

/* actions BL : on envoie aussi la liste des id affichés */
function idsBL(b){return b.lignes.map(function(l){return l.id;});}
/* BUSY = clé du BL en cours d'écriture : tous les boutons sont bloqués jusqu'à la réponse */
function finBusy(){BUSY='';}
function nomBL(b){return b.fournisseur+' du '+b.date+(b.ref?' ('+b.ref+')':'');}
function valider(bi){
  var b=S.bls[bi],k=b.key; if(BUSY)return;
  if(!confirmeV[k]){confirmeV[k]=1;rendre();setTimeout(function(){delete confirmeV[k];if(vue===1&&BUSY!==k)rendre();},5000);return;}
  delete confirmeV[k]; BUSY=k; rendre();
  var r=google.script.run.withSuccessHandler(function(x){finBusy();attente=false;
      toast('✓ '+nomBL(b)+' : '+x.msg);sig='';recevoir(x.state,true);})
    .withFailureHandler(function(e){finBusy();attente=false;toast('✗ '+(e.message||String(e)));sig='';charger(true);});
  attente=true; if(b.type==='BR')r.validerBR(k,idsBL(b)); else r.validerBL(k,idsBL(b));
}
function retirer(bi){
  var b=S.bls[bi],k=b.key; if(BUSY)return;
  if(!confirme[k]){confirme[k]=1;rendre();setTimeout(function(){delete confirme[k];if(vue===1)rendre();},4000);return;}
  delete confirme[k]; BUSY=k; rendre();
  var r=google.script.run.withSuccessHandler(function(s){finBusy();attente=false;toast('✓ '+nomBL(b)+' retiré du Dispatch.');sig='';recevoir(s,true);})
    .withFailureHandler(function(e){finBusy();attente=false;toast('✗ '+(e.message||String(e)));sig='';charger(true);});
  attente=true; r.retirerBL(k,idsBL(b));
}

/* onglet Heures : lecture seule, rafraîchi toutes les 4 s, nouvelles lignes surlignées */
var HJ='', HS=null, HD=null;
function chargerHeures(){
  google.script.run.withSuccessHandler(recevoirHeures)
    .withFailureHandler(function(){document.getElementById('dot').className='dot ko';}).getHeures(HJ);
}
function sigH(l){return [l.deb,l.fin,l.client,l.tache,l.comm].join('|');}
function recevoirHeures(h){
  if(vue!==3)return;
  document.getElementById('dot').className='dot';
  document.getElementById('maj').textContent='Mis à jour '+h.maj;
  var prev=(HS&&HS.jour===h.jour)?HS.sigs:null, sigs={}, nouv={};
  h.lignes.forEach(function(l){var s=sigH(l);sigs[s]=1;if(prev&&!prev[s])nouv[s]=1;});
  var n=JSON.stringify(h.lignes)+h.jour, k=Object.keys(nouv);
  HS={jour:h.jour,sigs:sigs}; HJ=h.jour;
  if(HD===n&&!k.length)return; HD=n;
  rendreHeures(h,nouv);
  if(k.length){var l=h.lignes.filter(function(x){return nouv[sigH(x)];})[0];
    toast('Enregistré : '+l.deb+'–'+l.fin+' · '+(l.client||'?')+(l.tache?' · '+l.tache:''));}
}
function jourAuj(){HJ='';HS=null;HD=null;chargerHeures();}
function decaler(j){
  var p=HJ.split('/'),d=new Date(+p[2],+p[1]-1,+p[0]+j);
  HJ=('0'+d.getDate()).slice(-2)+'/'+('0'+(d.getMonth()+1)).slice(-2)+'/'+d.getFullYear();
  HS=null;HD=null;document.getElementById('main').innerHTML='<div class="vide">Chargement…</div>';chargerHeures();
}

function pubCat(l){var n=l.prix_net_ht,p=l.prix_public_ht;return(p!=null&&n!=null&&p>n*1.001)?p:null;}
function valCat(l,k){return k==='pub'?pubCat(l):l[k];}

    if(x==null&&y==null)return 0; if(x==null)return 1; if(y==null)return -1;
    return (typeof x==='number'&&typeof y==='number'?x-y:String(x).localeCompare(String(y),'fr'))*CATSORT.d;});
  var mini=null;L.forEach(function(l){if(l.prix_net_ht!=null&&(mini==null||l.prix_net_ht<mini))mini=l.prix_net_ht;});
  var cols=[['fournisseur','Fournisseur'],['marque','Marque'],['libelle','Désignation'],['ref_fabricant','Réf.'],['prix_net_ht','Net HT'],['pub','Public HT'],['prix_gapc','GAPC'],['unite','Unité']];

    if(CATOPEN[l._i]){

      (l.autres_offres||[]).forEach(function(o){d.push('Aussi chez '+o.fournisseur+' : '+(o.prix_net_ht!=null?eur(o.prix_net_ht):'—'));});

/* même calcul que pl_placer_ (Planning.gs) : fixes d'abord par date, puis mobiles dans l'ordre */
function plPlacer(){
  var J=PL.E.jours.length,occ=[],al={},seq=0;for(var d=0;d<J;d++)occ.push(0);
  var it=PL.IT.filter(function(x){return plH(x)>0;});
  it.forEach(function(x){al[x.id]=[];});
  it.filter(function(x){return x.f&&x.j!=null;}).sort(function(a,b){return a.j-b.j||it.indexOf(a)-it.indexOf(b);}).forEach(function(x){
    var r=plH(x),d=x.j;
    while(r>1e-3&&d<J){var u=x.chev?Math.min(r,7.5):Math.min(r,7.5-occ[d]);if(u>1e-3){occ[d]=Math.min(7.5,occ[d]+u);r-=u;al[x.id].push([d,u,seq++]);}d++;}});
  it.forEach(function(x){if(x.f&&x.j!=null)return;var r=plH(x),d=x.j||0;
    while(r>1e-3&&d<J){var u=Math.min(r,7.5-occ[d]);if(u>1e-3){occ[d]+=u;r-=u;al[x.id].push([d,u,seq++]);}if(7.5-occ[d]<=1e-3)d++;}});
  var S=[];it.forEach(function(x){var cur=null;al[x.id].forEach(function(p){if(cur&&p[0]-cur.e<=1){cur.e=p[0];cur.h+=p[1];}else{cur={it:x,s:p[0],e:p[0],h:p[1],o:p[2]};S.push(cur);}});});
  S.sort(function(a,b){return a.s-b.s||a.o-b.o;});
  var n={},k={};S.forEach(function(s){n[s.it.id]=(n[s.it.id]||0)+1;});S.forEach(function(s){if(n[s.it.id]>1){k[s.it.id]=(k[s.it.id]||0)+1;s.part=k[s.it.id]+'/'+n[s.it.id];}});
  return S;
}

function plOrdre(els,itemEl){
  var order=els.map(function(el){return PL.SEG[+el.dataset.i];}),moved=PL.SEG[+itemEl.dataset.i],it=moved.it,pos=els.indexOf(itemEl);
  var v=[order[pos-1],order[pos+1]].filter(function(s){return s&&s.it!==it&&s.it.c===it.c&&!(s.it.f&&s.it.j!=null);})[0];
  if(v){var w=v.it;
    if(w.ch&&it.ch){w.ch=w.ch.concat(it.ch);w.chMod=true;}else{w.h=plH(w)+plH(it);w.hMod=true;w.ch=null;}
    if(it.nom!==w.nom&&w.nom.indexOf(it.nom)<0)w.nom=w.nom+' + '+it.nom;
    PL.IT=PL.IT.filter(function(x){return x!==it;});plModif(w.id,it.c+' : bouts fusionnés, '+plF(plH(w))+' h.');return;}
  var mob=[];order.forEach(function(s){if(s.it.f&&s.it.j!=null)return;if(s.it===it&&s!==moved)return;if(mob.indexOf(s.it)<0)mob.push(s.it);});

}

  els.forEach(function(e){var d=r.get(e)-e.getBoundingClientRect().top;if(d&&e!==PL.DR.el){e.style.transition='none';e.style.transform='translateY('+d+'px)';requestAnimationFrame(function(){e.style.transition='transform .16s ease-out';e.style.transform='';});}});}

  document.body.appendChild(g);el.classList.add('gho');PL.DR={el:el,g:g,dy:y-r.top,y:y};if(navigator.vibrate)navigator.vibrate(15);

function plBouger(y){
  var D=PL.DR,L=document.getElementById('pll');D.y=y;D.g.style.top=(y-D.dy)+'px';
  var tous=[].slice.call(L.children),top0=L.getBoundingClientRect().top,acc=0,cible=null,apres=false;
  for(var i=0;i<tous.length;i++){var hh=tous[i].offsetHeight+6;if(y<top0+acc+hh){cible=tous[i];apres=y>top0+acc+hh/2;break;}acc+=hh;}
  if(!cible){cible=tous[tous.length-1];apres=true;}
  if(cible!==D.el){var ref=apres?cible.nextSibling:cible;if(ref!==D.el&&!(apres&&cible.nextSibling===D.el))plFlip(L,function(){L.insertBefore(D.el,ref);});}

}

  var ids=HV.filter(function(p){return !p.bloquants.length;}).map(function(p){return p.id;});
  if(!ids.length)return;
  if(!HVCONF){HVCONF=true;b.textContent='Confirmer : '+ids.length+' ligne(s)';
    setTimeout(function(){if(HVCONF){HVCONF=false;HD=null;chargerHeures();}},5000);return;}
  HVCONF=false; attente=true; b.disabled=true; b.textContent='⏳ Enregistrement…';
  google.script.run.withSuccessHandler(hvApres)
    .withFailureHandler(function(e){attente=false;toast('✗ '+(e.message||String(e)));HD=null;chargerHeures();}).validerPropositions(ids);
}
function hvRefuser(b){
  if(!b.dataset.ok){b.dataset.ok=1;b.textContent='Écarter ?';setTimeout(function(){if(b){delete b.dataset.ok;b.textContent='✕';}},4000);return;}
  attente=true;
  google.script.run.withSuccessHandler(hvApres)
    .withFailureHandler(function(e){attente=false;toast('✗ '+(e.message||String(e)));}).refuserPropositions([b.dataset.id]);
}
var _hvAccueil=accueil;
accueil=function(){
  _hvAccueil();
  google.script.run.withSuccessHandler(function(n){var b=document.getElementById('nb3');if(b&&vue===0)b.textContent=n?n+' à valider':'';}).nbPropositions();
};

accueil();
