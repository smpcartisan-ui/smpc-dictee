<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14213d">
<title>SMPC Dictée</title>
<style>
  :root{--fond:#f4f5f7;--carte:#fff;--texte:#14213d;--doux:#6b7280;--accent:#e85d04;--ok:#2a9d8f;--err:#c1121f;--bord:#dfe3ea}
  @media (prefers-color-scheme:dark){:root{--fond:#0f1420;--carte:#1a2132;--texte:#eef1f6;--doux:#9aa3b2;--bord:#2b3448}}
  *{box-sizing:border-box;margin:0}
  html,body{height:100%;background:var(--fond);color:var(--texte);font:16px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  body{display:flex;flex-direction:column;height:100dvh}
  header{padding:6px 10px calc(8px + env(safe-area-inset-bottom));background:var(--carte);border-top:1px solid var(--bord);flex:none}
  .ligne{display:flex;gap:8px;align-items:stretch}
  #micro{flex:1;min-height:64px;border:0;border-radius:14px;font-size:20px;font-weight:700;color:#fff;background:var(--texte);display:flex;align-items:center;justify-content:center;gap:10px}
  #micro.ecoute{background:var(--accent);animation:pouls 1.4s infinite}
  #micro.attente{background:var(--doux)}
  @keyframes pouls{50%{filter:brightness(1.15)}}
  .petit{width:56px;border:1px solid var(--bord);border-radius:14px;background:var(--fond);color:var(--texte);font-size:22px}
  #envoyer{width:84px;background:var(--ok);color:#fff;border:0;font-size:16px;font-weight:700}
  #envoyer:disabled{opacity:.4}
  #dictee{margin-bottom:4px;min-height:1.4em;max-height:4.2em;overflow:auto;font-size:17px}
  #dictee .provisoire{color:var(--doux)}
  #reponse{margin-bottom:4px;padding:6px 8px;border-radius:10px;background:var(--fond);font-size:16px;max-height:6.5em;overflow:auto;display:none}
  #reponse.err{color:var(--err)}
  #reponse.plein{max-height:45vh}
  .opts{display:flex;gap:12px;margin:2px 0 6px;font-size:13px;color:var(--doux);align-items:center}
  .opts label{display:flex;gap:4px;align-items:center}
  iframe{flex:1;width:100%;border:0;background:#fff}
  #reglages{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:16px}
  #reglages div{background:var(--carte);border-radius:14px;padding:16px;width:100%;max-width:420px;display:flex;flex-direction:column;gap:8px}
  #reglages input{padding:10px;border:1px solid var(--bord);border-radius:8px;font-size:15px;background:var(--fond);color:var(--texte)}
  #reglages button{padding:12px;border:0;border-radius:10px;background:var(--ok);color:#fff;font-weight:700;font-size:16px}
</style>
</head>
<body>
<iframe id="webapp" title="Dispatch"></iframe>
<header>
  <div id="dictee"></div>
  <textarea id="clavier" rows="2" placeholder="Ou dicte avec le micro du clavier, puis Envoyer" style="display:none;width:100%;font:inherit;font-size:17px;padding:6px 8px;border:1px solid var(--bord);border-radius:10px;background:var(--fond);color:var(--texte);margin-bottom:4px"></textarea>
  <div id="reponse"></div>
  <div class="opts">
    <label><input type="checkbox" id="mainsLibres"> Mains libres</label>
    <label><input type="checkbox" id="voix"> Lire</label>
    <span style="flex:1"></span>
    <span id="conso" title="Coût API : dernier échange · jour · mois / plafond"></span>
    <button id="ouvrirReglages" class="petit" style="width:36px;height:28px;font-size:15px">⚙</button>
  </div>
  <div class="ligne">
    <button id="micro">🎤 Parler</button>
    <button id="modeClavier" class="petit" title="Dicter avec le clavier (sans bips)">⌨</button>
    <button id="effacer" class="petit" title="Effacer">⌫</button>
    <button id="envoyer" class="petit" disabled>Envoyer</button>
  </div>
</header>

<div id="reglages"><div>
  <b>Réglages</b>
  <label>Adresse de la webapp (…/exec)<input id="cfgUrl"></label>
  <label>Jeton<input id="cfgJeton" type="password"></label>
  <button id="cfgOk">Enregistrer</button>
</div></div>

<script>
const URL_DEFAUT='https://script.google.com/macros/s/AKfycbwyd2qY9wQKEpR8WArWwFhghePVgZs0SLLCqNDRPodzMoBCFCMViXeYV4wt_4Yb3N__/exec';
const $=id=>document.getElementById(id);
const stock={get:(k,d)=>{try{const v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
let cfg={url:stock.get('smpc_url',URL_DEFAUT),jeton:stock.get('smpc_jeton','')};
let historique=[];try{historique=JSON.parse(sessionStorage.getItem('smpc_hist')||'[]')}catch(e){}

$('mainsLibres').checked=stock.get('smpc_ml','1')==='1';
$('voix').checked=stock.get('smpc_voix','1')==='1';
$('mainsLibres').onchange=e=>stock.set('smpc_ml',e.target.checked?'1':'0');
$('voix').onchange=e=>{stock.set('smpc_voix',e.target.checked?'1':'0');if(!e.target.checked)speechSynthesis.cancel()};

function chargerWebapp(){$('webapp').src=cfg.url}
function ouvrirReglages(){$('cfgUrl').value=cfg.url;$('cfgJeton').value=cfg.jeton;$('reglages').style.display='flex'}
$('ouvrirReglages').onclick=ouvrirReglages;
$('cfgOk').onclick=()=>{cfg.url=$('cfgUrl').value.trim()||URL_DEFAUT;cfg.jeton=$('cfgJeton').value.trim();
  stock.set('smpc_url',cfg.url);stock.set('smpc_jeton',cfg.jeton);$('reglages').style.display='none';chargerWebapp();chargerConso()};
chargerWebapp();if(!cfg.jeton)ouvrirReglages();

/* ---- Reconnaissance vocale ---- */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=null,ecoute=false,texteFinal='',provisoire='',envoiEnCours=false;
const MOT_ENVOI=/[\s,.]*\b(envoie|envoyer|envoi)[\s.!]*$/i;

function afficher(){
  $('dictee').innerHTML='';
  $('dictee').append(document.createTextNode(texteFinal));
  if(provisoire){const s=document.createElement('span');s.className='provisoire';s.textContent=(texteFinal?' ':'')+provisoire;$('dictee').append(s)}
  $('envoyer').disabled=!texteFinal.trim()||envoiEnCours;
}
function majBouton(){
  const b=$('micro');b.className=envoiEnCours?'attente':(ecoute?'ecoute':'');
  b.textContent=envoiEnCours?'⏳ Claude…':(ecoute?'⏸ Pause':(texteFinal?'🎤 Reprendre':'🎤 Parler'));
}
function demarrer(){
  if(!SR){message('Reconnaissance vocale absente de ce navigateur (utilise Chrome).',true);return}
  speechSynthesis.cancel();
  ecoute=true;relances=0;majBouton();lancerRec();
}
// Une seule session d'écoute continue. Le texte de la session est reconstruit à chaque
// événement à partir de tous ses résultats (évite les doublons d'Android).
let base='',relances=0;
// Android renvoie des morceaux cumulés (« un », « un deux », « un deux trois ») :
// un morceau qui reprend le texte déjà là le remplace au lieu de s'y ajouter.
function fusion(a,b){
  if(!a)return b;if(!b)return a;
  const A=a.toLowerCase(),B=b.toLowerCase();
  if(B.startsWith(A))return b;
  if(A.endsWith(B)||A.startsWith(B))return a;
  return a+' '+b;
}
function lancerRec(){
  if(rec){try{rec.onend=null;rec.abort()}catch(x){}}
  base=texteFinal;const debut=Date.now();
  rec=new SR();rec.lang='fr-FR';rec.continuous=true;rec.interimResults=true;
  rec.onresult=e=>{
    let fin='',prov='';
    for(let i=0;i<e.results.length;i++){
      const t=e.results[i][0].transcript.trim();
      if(e.results[i].isFinal)fin=fusion(fin,t); else prov=fusion(prov,t);
    }
    if(fin&&prov.toLowerCase().startsWith(fin.toLowerCase()))prov=prov.slice(fin.length).trim();
    texteFinal=(base&&fin?base+' ':base)+fin;provisoire=prov;relances=0;
    if(MOT_ENVOI.test(texteFinal)){texteFinal=texteFinal.replace(MOT_ENVOI,'');provisoire='';arreter();envoyer();return}
    afficher();
  };
  rec.onerror=e=>{if(document.hidden){ecoute=false;majBouton();return}if(e.error==='not-allowed'||e.error==='service-not-allowed'){ecoute=false;majBouton();message('Micro refusé. Autorise le micro pour ce site.',true)}};
  rec.onend=()=>{
    if(provisoire){texteFinal=fusion(texteFinal,provisoire)}
    provisoire='';afficher();
    // Chrome coupe l'écoute après un long silence : on relance, mais pas en boucle.
    if(ecoute&&Date.now()-debut>3000&&relances<3){relances++;lancerRec()}
    else if(ecoute){ecoute=false;majBouton()}
  };
  try{rec.start()}catch(x){}
}
/* ---- Écran allumé tant que la page est ouverte (sinon la veille coupe le micro) ---- */
let verrouEcran=null;
async function garderEcran(){
  try{if('wakeLock' in navigator&&!verrouEcran&&!document.hidden){verrouEcran=await navigator.wakeLock.request('screen');verrouEcran.addEventListener('release',()=>{verrouEcran=null})}}catch(e){}
}
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){if(ecoute)arreter()}   // page masquée : on coupe proprement, sans message d'erreur
  else garderEcran();
});
document.addEventListener('click',garderEcran,{once:false,passive:true});
garderEcran();

/* ---- Dictée au clavier (micro de Gboard : pas de bips, pas de coupures) ---- */
let modeClavier=stock.get('smpc_clavier','0')==='1';
function majClavier(){
  $('clavier').style.display=modeClavier?'block':'none';$('dictee').style.display=modeClavier?'none':'block';
  $('micro').style.display=modeClavier?'none':'flex';$('modeClavier').style.background=modeClavier?'var(--accent)':'';
}
$('modeClavier').onclick=()=>{modeClavier=!modeClavier;stock.set('smpc_clavier',modeClavier?'1':'0');if(ecoute)arreter();majClavier();if(modeClavier)$('clavier').focus()};
$('clavier').oninput=()=>{texteFinal=$('clavier').value;$('envoyer').disabled=!texteFinal.trim()||envoiEnCours};
majClavier();

function arreter(){ecoute=false;if(rec){try{rec.onend=null;rec.stop()}catch(x){}}
  if(provisoire){texteFinal=fusion(texteFinal,provisoire);provisoire=''}
  afficher();majBouton()}
$('micro').onclick=()=>{if(envoiEnCours)return;ecoute?arreter():demarrer()};
$('effacer').onclick=()=>{$('clavier').value='';texteFinal='';provisoire='';afficher();majBouton()};
$('envoyer').onclick=()=>{arreter();envoyer()};

/* ---- Échange avec Claude ---- */
function message(t,err){const r=$('reponse');r.style.display='block';r.textContent=t;r.className=err?'err':''}
$('reponse').onclick=()=>$('reponse').classList.toggle('plein');

async function envoyer(){
  const texte=texteFinal.trim();if(!texte||envoiEnCours)return;
  if(!cfg.jeton){ouvrirReglages();return}
  envoiEnCours=true;majBouton();afficher();message('…');
  try{
    const r=await fetch(cfg.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({action:'chat',jeton:cfg.jeton,texte,historique:historique.slice(-12)})});
    const j=await r.json();
    afficherConso(j.conso);
    message(j.texte,!j.ok);
    if(j.ok){
      historique.push({role:'brieg',texte},{role:'claude',texte:j.texte});
      try{sessionStorage.setItem('smpc_hist',JSON.stringify(historique.slice(-24)))}catch(e){}
      texteFinal='';$('clavier').value='';
      rafraichirWebapp();
    }
    envoiEnCours=false;majBouton();afficher();
    parler(j.texte,()=>{if(j.ok&&$('mainsLibres').checked&&!modeClavier&&!document.hidden)demarrer()});
  }catch(e){
    envoiEnCours=false;majBouton();afficher();
    message('✗ Pas de réponse ('+e.message+'). La dictée est gardée : renvoie.',true);
  }
}
function rafraichirWebapp(){/* la webapp se rafraîchit seule toutes les 4 s */}

function parler(t,ensuite){
  if(!$('voix').checked||!('speechSynthesis' in window)){ensuite&&ensuite();return}
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(t.replace(/^✗\s*/,''));u.lang='fr-FR';u.rate=1.1;
  const v=speechSynthesis.getVoices().find(v=>v.lang&&v.lang.startsWith('fr'));if(v)u.voice=v;
  u.onend=()=>ensuite&&ensuite();u.onerror=()=>ensuite&&ensuite();
  speechSynthesis.speak(u);
}
/* ---- Indicateur de coût ---- */
const fmt=n=>(n||0).toFixed(n<0.1?3:2).replace('.',',');
function afficherConso(c){
  if(!c)return;const el=$('conso');
  const part=Math.max(c.jour/c.budgetJour,c.mois/c.budgetMois);
  el.textContent=(c.echange?fmt(c.echange)+' $ · ':'')+'jour '+fmt(c.jour)+' · mois '+fmt(c.mois)+'/'+c.budgetMois+' $';
  el.style.color=part>=0.9?'var(--err)':part>=0.6?'var(--accent)':'';
  el.style.fontWeight=part>=0.6?'700':'';
}
async function chargerConso(){
  if(!cfg.jeton)return;
  try{const r=await fetch(cfg.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify({action:'conso',jeton:cfg.jeton})});afficherConso((await r.json()).conso)}catch(e){}
}
chargerConso();

afficher();majBouton();
if(historique.length)message(historique[historique.length-1].texte);
</script>
</body>
</html>
